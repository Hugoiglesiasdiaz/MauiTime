<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo rojo intenso de alto impacto -->
  <rect width="500" height="500" fill="#cc0000"/>
  
  <!-- Bloque diagonal negro cortando la pantalla de lado a lado -->
  <polygon points="0,120 500,200 500,380 0,300" fill="#0b0b0b"/>

  <!-- Texto central en blanco sobre el bloque negro -->
  <text x="250" y="270" font-family="Impact, Arial Black, sans-serif" font-size="65" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="8">MAUITIME</text>
</svg>
